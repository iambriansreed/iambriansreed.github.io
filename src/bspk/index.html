<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="author" content="iambriansreed" />
        <title>BSPK / Brian S. Reed</title>
        <link
            rel="preload"
            href="/fonts/Archivo.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/icon/apple-touch-icon-180x180.png"
        />
        <link
            rel="icon"
            type="image/png"
            href="/icon/favicon-192x192.png"
            sizes="192x192"
        />
        <link
            rel="icon"
            type="image/png"
            href="/icon/favicon-32x32.png"
            sizes="32x32"
        />
        <link
            rel="icon"
            type="image/png"
            href="/icon/favicon-16x16.png"
            sizes="16x16"
        />
        <link rel="stylesheet" href="/appearance.css" />
        <link rel="stylesheet" href="./style.css" />
        <script>
            // Same restore as the home page, so a theme or accent picked there
            // carries over.
            // Saved choice first, then the OS preference, then dark.
            const savedTheme = localStorage.getItem('theme');
            document.documentElement.dataset.theme =
                savedTheme === 'light' || savedTheme === 'dark'
                    ? savedTheme
                    : matchMedia('(prefers-color-scheme: light)').matches
                      ? 'light'
                      : 'dark';

            document.documentElement.style.setProperty(
                '--accent',
                localStorage.getItem('accent') || '#7a8a3a',
            );
        </script>
    </head>
    <body></body>
</html>
