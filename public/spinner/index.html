<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spin Wheel</title>
<style>
  :root {
    --bg: #0C1220;
    --surface: #151D2E;
    --text: #E2E6EF;
    --text-muted: #6B7A94;
    --border: #1E2A3E;
    --accent: #4E9AF5;
    --accent-hover: #3A82D9;
    --input-bg: #121A2A;
    --wheel-shadow: rgba(0,0,0,0.4);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    margin: 0;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
  }

  .wheel-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    width: 100%;
    max-width: min(90vw, calc(100dvh - 80px));
  }

  .wheel-container {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
  }

  canvas {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 8px 32px var(--wheel-shadow));
    cursor: pointer;
    border-radius: 50%;
  }

  .pointer {
    position: absolute;
    right: -8px;
    top: 50%;
    transform: translateY(-50%);
    width: 0;
    height: 0;
    border-top: 18px solid transparent;
    border-bottom: 18px solid transparent;
    border-right: 36px solid var(--accent);
    z-index: 2;
    filter: drop-shadow(-2px 0 8px rgba(78,154,245,0.4));
  }

  .spin-btn {
    position: absolute;
    bottom: 12px;
    left: 12px;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 12px 32px;
    border-radius: 99px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    z-index: 3;
  }
  .spin-btn:hover { background: var(--accent-hover); }
  .spin-btn:active { transform: scale(0.96); }
  .spin-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* --- Drawer panel --- */
  .drawer-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 42px;
    height: 42px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
    padding: 0;
  }
  .drawer-toggle:hover { background: var(--border); }
  .drawer-toggle svg { width: 20px; height: 20px; stroke: var(--text-muted); fill: none; stroke-width: 2; stroke-linecap: round; }
  .drawer-toggle.open svg .bar1 { transform: rotate(45deg); transform-origin: center; transition: transform 0.2s; }
  .drawer-toggle.open svg .bar2 { opacity: 0; transition: opacity 0.1s; }
  .drawer-toggle.open svg .bar3 { transform: rotate(-45deg); transform-origin: center; transition: transform 0.2s; }

  .drawer-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 18;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .drawer-backdrop.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .drawer {
    position: fixed;
    top: 0;
    right: 0;
    width: 360px;
    max-width: 85vw;
    height: 100dvh;
    background: var(--surface);
    border-left: 1px solid var(--border);
    padding: 72px 24px 24px 32px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow-y: auto;
    z-index: 20;
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .drawer.open { transform: translateX(0); }

  .drawer-title {
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0;
  }

  textarea {
    width: 100%;
    min-height: calc(3 * 1.7em + 32px);
    max-height: calc(15 * 1.7em + 32px);
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--input-bg);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    line-height: 1.7;
    resize: none;
    overflow-y: hidden;
    transition: border-color 0.15s;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  textarea::placeholder { color: var(--text-muted); }

  .save-row {
    display: flex;
    gap: 8px;
  }
  .save-row input {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--input-bg);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    transition: border-color 0.15s;
  }
  .save-row input:focus { outline: none; border-color: var(--accent); }
  .save-row input::placeholder { color: var(--text-muted); }

  .save-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .save-btn:hover { background: var(--accent-hover); }
  .save-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .entry-count {
    font-size: 12px;
    color: var(--text-muted);
    text-align: right;
    margin-top: -8px;
  }

  .section-title {
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-top: 8px;
  }

  .saved-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .saved-item-name {
    flex: 1;
    font-weight: 500;
    font-size: 14px;
    cursor: pointer;
    transition: color 0.1s;
  }
  .saved-item-name:hover { color: var(--accent); }
  .saved-item-count {
    font-size: 11px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  .saved-item-delete {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 4px;
    line-height: 1;
    transition: color 0.1s;
  }
  .saved-item-delete:hover { color: #E85D75; }
  .no-saved {
    font-size: 13px;
    color: var(--text-muted);
    font-style: italic;
  }
  .saved-lists {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .history { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .history-list { display: flex; flex-wrap: wrap; gap: 5px; }
  .history-chip {
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 99px;
    padding: 3px 12px;
    font-size: 12px;
    color: var(--text-muted);
  }

  .reset-btn {
    position: fixed;
    bottom: 16px;
    right: 16px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
    opacity: 0.35;
    transition: opacity 0.15s;
    padding: 4px 6px;
  }
  .reset-btn:hover { opacity: 1; }

  @media (max-width: 680px) {
    body { padding: 16px; }
    .wheel-section { max-width: min(95vw, calc(100dvh - 60px)); }
  }
</style>
</head>
<body style="visibility:hidden">

<div class="wheel-section">
  <div class="wheel-container">
    <div class="pointer"></div>
    <canvas id="wheel" width="800" height="800"></canvas>
    <button class="spin-btn" id="spinBtn">Spin</button>
  </div>
</div>

<button class="drawer-toggle open" id="drawerToggle" aria-label="Toggle entries panel">
  <svg viewBox="0 0 24 24"><line class="bar1" x1="4" y1="7" x2="20" y2="7"/><line class="bar2" x1="4" y1="12" x2="20" y2="12"/><line class="bar3" x1="4" y1="17" x2="20" y2="17"/></svg>
</button>

<div class="drawer-backdrop visible" id="drawerBackdrop"></div>

<div class="drawer open" id="drawer">
  <p class="drawer-title">Entries</p>
  <textarea id="entries">Pizza
Tacos
Nachos
Hot Dogs
Burgers
Fried Chicken
Donuts
Corn Dogs
Mozzarella Sticks
Onion Rings</textarea>
  <div class="save-row">
    <input type="text" id="listName" placeholder="List name…">
    <button class="save-btn" id="saveBtn">Save</button>
  </div>
  <div class="entry-count" id="count">0 entries</div>

  <p class="section-title">Saved Lists</p>
  <div class="saved-lists" id="savedContainer"></div>

  <div class="history" id="historySection" hidden>
    <p class="section-title">History</p>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<button class="reset-btn" id="resetBtn">Reset</button>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script>
  const ROYGBIV = [
    ['#E84040', '#FF8C00', '#F5D020', '#3CB043', '#2196F3', '#4B0082', '#8B00FF'],
    ['#FF6B6B', '#FFA94D', '#FFE066', '#69DB7C', '#4DABF7', '#7950F2', '#DA77F2'],
    ['#C62828', '#E65100', '#F9A825', '#2E7D32', '#1565C0', '#4A148C', '#AB47BC'],
  ];

  function getColors(count) {
    if (count === 0) return [];
    const result = [];
    for (let i = 0; i < count; i++) {
      const band = Math.floor(i / 7);
      const idx = i % 7;
      result.push(ROYGBIV[band % ROYGBIV.length][idx]);
    }
    return result;
  }

  const FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif';
  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const textarea = document.getElementById('entries');
  const spinBtn = document.getElementById('spinBtn');
  const countEl = document.getElementById('count');
  const historySection = document.getElementById('historySection');
  const historyList = document.getElementById('historyList');

  let items = [];
  let angle = 0;
  let spinning = false;
  let history = [];
  let highlightIndex = -1;

  function getItems() {
    return textarea.value.split('\n').map(s => s.trim()).filter(Boolean);
  }

  function drawWheel() {
    const w = canvas.width, h = canvas.height;
    const cx = w / 2, cy = h / 2, r = w / 2 - 16;
    ctx.clearRect(0, 0, w, h);

    if (items.length === 0) {
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = '#151D2E';
      ctx.fill();
      ctx.strokeStyle = '#1E2A3E';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.fillStyle = '#6B7A94';
      ctx.font = `500 24px ${FONT}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Add entries below', cx, cy);
      return;
    }

    const sliceAngle = (Math.PI * 2) / items.length;
    const colors = getColors(items.length);
    const isHighlighting = highlightIndex >= 0;

    if (isHighlighting) ctx.globalAlpha = 0.5;

    items.forEach((item, i) => {
      const start = angle + i * sliceAngle;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, start, start + sliceAngle);
      ctx.closePath();
      ctx.fillStyle = colors[i];
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(start + sliceAngle / 2);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fff';
      ctx.shadowColor = 'rgba(0,0,0,0.55)';
      ctx.shadowBlur = 5;
      ctx.shadowOffsetX = 1;
      ctx.shadowOffsetY = 1;

      const textR = 28 + (r - 28) * 0.6;
      const maxLen = (r - 28) * 0.7;
      const maxFS = Math.min(48, sliceAngle * r * 0.45);
      let fs = Math.max(12, Math.floor(maxFS));
      ctx.font = `700 ${fs}px ${FONT}`;
      while (ctx.measureText(item).width > maxLen && fs > 12) {
        fs--;
        ctx.font = `700 ${fs}px ${FONT}`;
      }
      let label = item;
      if (ctx.measureText(label).width > maxLen) {
        while (ctx.measureText(label + '…').width > maxLen && label.length > 1) label = label.slice(0, -1);
        label += '…';
      }
      ctx.fillText(label, textR, 0);
      ctx.shadowColor = 'transparent';
      ctx.restore();
    });

    ctx.globalAlpha = 1;

    ctx.beginPath();
    ctx.arc(cx, cy, 24, 0, Math.PI * 2);
    ctx.fillStyle = '#0C1220';
    ctx.fill();
    ctx.strokeStyle = '#1E2A3E';
    ctx.lineWidth = 3;
    ctx.stroke();

    if (isHighlighting && highlightIndex < items.length) {
      const winner = items[highlightIndex];
      ctx.beginPath();
      ctx.arc(cx, cy, r + 2, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fill();

      let fs = r * 0.22;
      ctx.font = `800 ${fs}px ${FONT}`;
      while (ctx.measureText(winner).width > r * 1.5 && fs > 20) {
        fs--;
        ctx.font = `800 ${fs}px ${FONT}`;
      }
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(78,154,245,0.35)';
      ctx.shadowBlur = 40;
      ctx.fillStyle = '#fff';
      ctx.fillText(winner, cx, cy);
      ctx.shadowColor = 'transparent';
    }
  }

  function spin() {
    if (spinning || items.length < 2) return;
    spinning = true;
    spinBtn.disabled = true;
    highlightIndex = -1;

    const totalRotation = Math.PI * 2 * (5 + Math.random() * 5);
    const spinDuration = 4000 + Math.random() * 1000;
    const startAngle = angle;
    const windupAngle = -(Math.PI * 0.15 + Math.random() * Math.PI * 0.1);
    const windupDuration = 350;
    const startTime = performance.now();

    function easeOut(t) { return 1 - Math.pow(1 - t, 4); }

    function animate(now) {
      const elapsed = now - startTime;
      if (elapsed < windupDuration) {
        angle = startAngle + windupAngle * Math.sin((elapsed / windupDuration) * Math.PI / 2);
        drawWheel();
        requestAnimationFrame(animate);
        return;
      }
      const progress = Math.min((elapsed - windupDuration) / spinDuration, 1);
      angle = startAngle + windupAngle + (-windupAngle + totalRotation) * easeOut(progress);
      drawWheel();

      if (progress < 1) {
        requestAnimationFrame(animate);
      } else {
        const TWO_PI = Math.PI * 2;
        const sliceAngle = TWO_PI / items.length;
        const norm = ((angle % TWO_PI) + TWO_PI) % TWO_PI;
        const winnerIndex = Math.floor(((TWO_PI - norm) % TWO_PI) / sliceAngle) % items.length;
        const winner = items[winnerIndex];

        const sliceCenter = winnerIndex * sliceAngle + sliceAngle / 2;
        const target = TWO_PI - sliceCenter;
        const current = ((angle % TWO_PI) + TWO_PI) % TWO_PI;
        let correction = target - current;
        if (correction > Math.PI) correction -= TWO_PI;
        if (correction < -Math.PI) correction += TWO_PI;

        setTimeout(() => {
          const snapStart = performance.now();
          const snapFrom = angle;
          function snapAnimate(now) {
            const t = Math.min((now - snapStart) / 400, 1);
            const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
            angle = snapFrom + correction * ease;
            drawWheel();
            if (t < 1) {
              requestAnimationFrame(snapAnimate);
            } else {
              spinning = false;
              spinBtn.disabled = false;
              highlightIndex = winnerIndex;
              drawWheel();

              confetti({ particleCount: 150, spread: 180, startVelocity: 50, origin: { x: 0.1, y: 0.5 } });
              confetti({ particleCount: 150, spread: 180, startVelocity: 50, origin: { x: 0.9, y: 0.5 } });
              confetti({ particleCount: 150, spread: 180, startVelocity: 55, origin: { x: 0.5, y: 0.3 } });
              setTimeout(() => {
                confetti({ particleCount: 100, spread: 160, startVelocity: 40, origin: { x: 0.3, y: 0.7 } });
                confetti({ particleCount: 100, spread: 160, startVelocity: 40, origin: { x: 0.7, y: 0.7 } });
              }, 200);
              history.unshift(winner);
              if (history.length > 20) history.pop();
              renderHistory();
            }
          }
          requestAnimationFrame(snapAnimate);
        }, 500);
      }
    }
    requestAnimationFrame(animate);
  }

  function renderHistory() {
    if (history.length === 0) { historySection.hidden = true; return; }
    historySection.hidden = false;
    historyList.innerHTML = '';
    history.forEach(h => {
      const chip = document.createElement('span');
      chip.className = 'history-chip';
      chip.textContent = h;
      historyList.appendChild(chip);
    });
  }

  function autoResize() {
    textarea.style.height = 'auto';
    textarea.style.overflowY = 'hidden';
    const maxH = parseFloat(getComputedStyle(textarea).maxHeight);
    const needed = textarea.scrollHeight;
    if (needed > maxH) {
      textarea.style.height = maxH + 'px';
      textarea.style.overflowY = 'auto';
    } else {
      textarea.style.height = needed + 'px';
    }
  }

  function update() {
    items = getItems();
    const n = items.length;
    countEl.textContent = `${n} entr${n === 1 ? 'y' : 'ies'}`;
    spinBtn.disabled = n < 2;
    if (!spinning && n > 0) {
      angle = -(Math.PI * 2 / n) / 2;
    }
    autoResize();
    updateSaveBtn();
    drawWheel();
  }

  // --- Saved lists ---
  const listNameInput = document.getElementById('listName');
  const saveBtn = document.getElementById('saveBtn');
  const savedContainer = document.getElementById('savedContainer');
  const STORAGE_KEY = 'spinwheel_lists';

  function loadSavedLists() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
  }
  function saveLists(lists) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(lists)); } catch {}
  }

  function renderSavedLists() {
    const lists = loadSavedLists();
    const names = Object.keys(lists);
    savedContainer.innerHTML = '';
    if (names.length === 0) {
      const empty = document.createElement('span');
      empty.className = 'no-saved';
      empty.textContent = 'No saved lists yet';
      savedContainer.appendChild(empty);
      return;
    }
    names.forEach(name => {
      const entries = lists[name];
      const row = document.createElement('div');
      row.className = 'saved-item';
      const nameEl = document.createElement('span');
      nameEl.className = 'saved-item-name';
      nameEl.textContent = name;
      nameEl.addEventListener('click', () => {
        textarea.value = entries.join('\n');
        listNameInput.value = name;
        update();
      });
      const cntEl = document.createElement('span');
      cntEl.className = 'saved-item-count';
      cntEl.textContent = `${entries.length} items`;
      const delBtn = document.createElement('button');
      delBtn.className = 'saved-item-delete';
      delBtn.textContent = '×';
      delBtn.addEventListener('click', () => {
        const all = loadSavedLists();
        delete all[name];
        saveLists(all);
        renderSavedLists();
      });
      row.append(nameEl, cntEl, delBtn);
      savedContainer.appendChild(row);
    });
  }

  function updateSaveBtn() {
    const lists = loadSavedLists();
    const name = listNameInput.value.trim();
    if (!name && items.length > 0) {
      const s = JSON.stringify(items);
      const match = Object.keys(lists).find(k => JSON.stringify(lists[k]) === s);
      if (match) listNameInput.value = match;
    }
    const cur = listNameInput.value.trim();
    if (!cur || items.length === 0) { saveBtn.disabled = true; return; }
    const saved = lists[cur];
    saveBtn.disabled = !!(saved && JSON.stringify(saved) === JSON.stringify(items));
  }

  saveBtn.addEventListener('click', () => {
    const name = listNameInput.value.trim();
    if (!name || items.length === 0) return;
    const lists = loadSavedLists();
    lists[name] = items;
    saveLists(lists);
    renderSavedLists();
    updateSaveBtn();
  });
  listNameInput.addEventListener('input', updateSaveBtn);

  textarea.addEventListener('input', update);
  textarea.addEventListener('blur', () => {
    textarea.value = getItems().join('\n');
    update();
  });
  spinBtn.addEventListener('click', spin);
  canvas.addEventListener('click', spin);

  // --- Drawer ---
  const drawer = document.getElementById('drawer');
  const drawerToggle = document.getElementById('drawerToggle');
  const drawerBackdrop = document.getElementById('drawerBackdrop');

  function toggleDrawer() {
    const open = drawer.classList.toggle('open');
    drawerToggle.classList.toggle('open', open);
    drawerBackdrop.classList.toggle('visible', open);
  }
  drawerToggle.addEventListener('click', toggleDrawer);
  drawerBackdrop.addEventListener('click', toggleDrawer);

  // --- Seed defaults ---
  (function seedDefaults() {
    try {
      if (localStorage.getItem('spinwheel_seeded')) return;
      const lists = loadSavedLists();
      if (Object.keys(lists).length === 0) {
        lists['Junk Food'] = ['Pizza','Tacos','Nachos','Hot Dogs','Burgers','Fried Chicken','Donuts','Corn Dogs','Mozzarella Sticks','Onion Rings'];
        lists['Star Trek'] = ['Kirk','Picard','Sisko','Janeway','Archer','Pike','Darth Vader','Chewbacca','Yoda'];
        saveLists(lists);
      }
      localStorage.setItem('spinwheel_seeded', '1');
    } catch {}
  })();

  document.getElementById('resetBtn').addEventListener('click', () => {
    try {
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem('spinwheel_seeded');
    } catch {}
    location.reload();
  });

  update();
  renderSavedLists();
  document.body.style.visibility = 'visible';
</script>
</body>
</html>
