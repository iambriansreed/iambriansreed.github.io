<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-label="BSPK, a design system: the same components in light and dark themes, split down the middle">
  <defs>
    <clipPath id="light"><polygon points="0,0 880,0 720,800 0,800"/></clipPath>
    <clipPath id="dark"><polygon points="880,0 1600,0 1600,800 720,800"/></clipPath>
  </defs>
  <g clip-path="url(#light)">
