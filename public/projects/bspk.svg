    <text x="800" y="296" text-anchor="middle" font-size="40" font-weight="500" fill="#5c5c5c">Ten brands. Light and dark.</text>

    <text x="330" y="376" font-size="22" font-weight="600" fill="#141414">Email</text>
    <rect x="331" y="390" width="420" height="58" rx="8" fill="none" stroke="#767676" stroke-width="2"/>
    <text x="353" y="428" font-size="24" fill="#141414">jane@example.com</text>

    <rect x="800" y="390" width="440" height="58" rx="10" fill="#e4e4e4"/>
