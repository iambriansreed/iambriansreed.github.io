<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>House Chores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #17242b;
    --ink-soft: #4a5a62;
    --paper: #f5f1e8;
    --card: #fffdf8;
    --line: #ddd5c4;
    --teal: #1f6f6b;
    --teal-deep: #14504d;
    --rust: #c25a3a;
    --amber: #d99518;
    --today-bg: #1f6f6b;
    --shadow: 0 1px 2px rgba(23,36,43,.06), 0 6px 20px rgba(23,36,43,.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.4;
    padding: 0 0 env(safe-area-inset-bottom);
    max-width: 560px;
    margin: 0 auto;
    min-height: 100vh;
  }
  header {
    padding: 22px 20px 14px;
    position: sticky; top: 0; z-index: 20;
    background: linear-gradient(var(--paper) 78%, rgba(245,241,232,0));
  }
  .brand { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 26px;
    letter-spacing: -0.01em;
    line-height: 1;
  }
  .weektag {
    font-size: 12px; font-weight: 600;
    color: var(--teal-deep);
    background: #e4ede8;
    border: 1px solid #cfe0d8;
    padding: 4px 9px; border-radius: 999px;
    white-space: nowrap;
  }
  .weektag.b { color: var(--rust); background: #f6e7df; border-color: #eccdbf; }
  .datebar { font-size: 13px; color: var(--ink-soft); margin-top: 5px; font-weight: 500; }

  .filter { padding: 4px 14px 12px; }
  .filter-scroll {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 6px 6px 8px;
    scroll-snap-type: x proximity;
    -ms-overflow-style: none; scrollbar-width: none;
  }
  .filter-scroll::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; scroll-snap-align: start;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 600;
    padding: 9px 15px; border-radius: 999px;
    border: 1.5px solid var(--line);
    background: var(--card); color: var(--ink-soft);
    cursor: pointer; transition: all .15s ease;
    display: flex; align-items: center; gap: 7px;
  }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; opacity: .8; }
  .chip[aria-pressed="true"] {
    color: #fff; border-color: transparent;
    box-shadow: var(--shadow);
  }
  .chip[aria-pressed="true"] .dot { background: rgba(255,255,255,.9); opacity: 1; }

  main { padding: 0 14px 40px; }
  .day {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    margin-bottom: 16px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .day-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
  }
  .day-head.today { background: var(--today-bg); border-bottom-color: var(--teal-deep); }
  .day-title { display: flex; flex-direction: column; gap: 1px; }
  .day-when { font-family: 'Fraunces', serif; font-weight: 600; font-size: 19px; }
  .day-date { font-size: 12px; font-weight: 500; opacity: .7; }
  .day-head.today .day-when, .day-head.today .day-date { color: #fff; }
  .day-head.today .day-date { opacity: .82; }
  .count {
    font-size: 12px; font-weight: 700;
    padding: 4px 10px; border-radius: 999px;
    background: #eee7d7; color: var(--ink-soft);
  }
  .day-head.today .count { background: rgba(255,255,255,.16); color: #fff; }

  ul { list-style: none; }
  li.task {
    display: flex; align-items: center; gap: 13px;
    padding: 13px 18px;
    border-bottom: 1px solid #efe9db;
    cursor: pointer;
    transition: background .12s ease;
  }
  li.task:last-child { border-bottom: none; }
  li.task:active { background: #f7f2e6; }
  .check {
    flex: 0 0 auto;
    width: 23px; height: 23px; border-radius: 7px;
    border: 2px solid var(--line);
    display: grid; place-items: center;
    transition: all .15s ease;
  }
  li.done .check { background: var(--teal); border-color: var(--teal); }
  .check svg { width: 13px; height: 13px; stroke: #fff; stroke-width: 3.5; fill: none; opacity: 0; transition: opacity .15s; }
  li.done .check svg { opacity: 1; }
  .task-body { flex: 1; min-width: 0; }
  .task-name { font-size: 15px; font-weight: 500; transition: color .15s; }
  li.done .task-name { color: #a9a291; text-decoration: line-through; }
  .task-who {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; margin-top: 2px;
  }
  .task-who .dot { width: 7px; height: 7px; border-radius: 50%; }
  .badge-note {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    color: var(--amber); margin-left: 7px;
  }
  .empty {
    padding: 26px 18px; text-align: center;
    color: var(--ink-soft); font-size: 14px;
  }
  .empty strong { color: var(--ink); font-weight: 600; }
  footer {
    text-align: center; font-size: 11px; color: #a9a291;
    padding: 8px 20px 30px; font-weight: 500;
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>House Chores</h1>
      <span id="weektag" class="weektag">Week A</span>
    </div>
    <div id="datebar" class="datebar"></div>
  </header>

  <div class="filter">
    <div id="filterScroll" class="filter-scroll" role="group" aria-label="Filter by person"></div>
  </div>

  <main id="main"></main>
  <footer>
    Tap a task to check it off. Week flips every other Friday.
    <div id="devbar" style="margin-top:14px;padding-top:12px;border-top:1px dashed #d3cbb9;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;">
      <label for="devdate" style="font-weight:600;color:#8a8270;">Dev: preview date</label>
      <input type="date" id="devdate" style="font-family:'DM Sans',sans-serif;font-size:13px;padding:5px 8px;border:1px solid #d3cbb9;border-radius:8px;background:#fffdf8;color:#4a5a62;">
      <button id="devreset" style="font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;padding:5px 10px;border:1px solid #d3cbb9;border-radius:8px;background:#fffdf8;color:#4a5a62;cursor:pointer;">Reset to real today</button>
    </div>
  </footer>

<script>
/* ---------- People ---------- */
const PEOPLE = {
  Brian:   { color: '#1f6f6b' },
  Heather: { color: '#c25a3a' },
  Ryleigh: { color: '#7a5bb0' },
  Sean:    { color: '#2f7bbf' },
  Jack:    { color: '#3f9e5a' },
  Nathan:  { color: '#d99518' },
};
const ORDER = ['Brian','Heather','Ryleigh','Sean','Jack','Nathan'];

/* Days in chart order, starting Friday */
const DAYS = ['Fri','Sat','Sun','Mon','Tue','Wed','Thu'];
/* JS getDay(): 0=Sun..6=Sat -> our label */
const JS_TO_LABEL = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

/*
 Each chore: name, optional note, and per-week arrays of 7 entries
 aligned to DAYS (Fri,Sat,Sun,Mon,Tue,Wed,Thu).
 An entry is a person name, an array of names (shared), or null.
 "Nightly/every day" jobs are just the same name 7x.
*/
const CHORES = [
  { name:'Put away silverware',
    A:['Nathan','Nathan','Nathan','Nathan','Nathan','Nathan','Nathan'],
    B:['Nathan','Nathan','Nathan','Nathan','Nathan','Nathan','Nathan'] },
  { name:'Wipe counters & table',
    A:['Sean','Jack','Sean','Jack','Sean','Jack','Sean'],
    B:['Nathan','Nathan','Nathan','Nathan','Nathan','Nathan','Nathan'] },
  { name:'Check mail',
    A:['Nathan','Nathan','Nathan','Nathan','Nathan','Nathan','Nathan'],
    B:['Nathan','Nathan','Nathan','Nathan','Nathan','Nathan','Nathan'] },
  { name:'Dog treats',
    A:['Brian','Heather','Brian','Heather','Brian','Heather','Brian'],
    B:['Brian','Heather','Brian','Heather','Brian','Heather','Brian'] },
  { name:'Pick up clutter & toys',
    A:[['Sean','Jack','Nathan'],['Sean','Jack','Nathan'],['Sean','Jack','Nathan'],['Sean','Jack','Nathan'],['Sean','Jack','Nathan'],['Sean','Jack','Nathan'],['Sean','Jack','Nathan']],
    B:['Nathan','Nathan','Nathan','Nathan','Nathan','Nathan','Nathan'] },
  { name:'Load dishwasher',
    A:['Ryleigh','Brian','Heather','Ryleigh','Heather','Brian','Heather'],
    B:['Brian','Heather','Brian','Heather','Brian','Heather','Brian'] },
  { name:'Unload dishwasher',
    A:['Sean','Ryleigh','Jack','Sean','Jack','Ryleigh','Jack'],
    B:['Ryleigh','Ryleigh','Ryleigh','Ryleigh','Ryleigh','Ryleigh','Ryleigh'] },
  { name:'Trash',
    A:['Jack','Ryleigh','Sean','Ryleigh','Jack','Sean','Jack'],
    B:['Ryleigh','Ryleigh','Ryleigh','Ryleigh','Ryleigh','Ryleigh','Ryleigh'] },
  { name:'Bins to the street', note:'night',
    A:[null,null,null,'Jack',null,null,null],
    B:[null,null,null,'Ryleigh',null,null,null] },
  { name:'Feed dog & cat', note:'AM & PM',
    A:['Sean','Jack','Sean','Jack','Sean','Jack','Sean'],
    B:['Heather','Ryleigh','Brian','Heather','Ryleigh','Brian','Heather'] },
  { name:'Litter box',
    A:[null,null,null,'Ryleigh',null,null,'Brian'],
    B:[null,null,null,'Ryleigh',null,null,'Heather'] },
  { name:'Exercise dog',
    A:['Heather','Ryleigh','Brian','Heather','Ryleigh','Brian','Heather'],
    B:['Ryleigh','Brian','Heather','Ryleigh','Brian','Heather','Ryleigh'] },
  { name:'Clean microwave',
    A:['Sean',null,null,null,null,null,null],
    B:['Heather',null,null,null,null,null,null] },
  { name:'Organize shoes',
    A:[null,null,'Nathan',null,null,null,null],
    B:[null,null,'Nathan',null,null,null,null] },
  { name:'Vacuum common areas',
    A:[null,null,'Brian',null,null,null,null],
    B:[null,null,'Brian',null,null,null,null] },
  { name:'Vacuum steps',
    A:[null,null,'Heather',null,null,null,null],
    B:[null,null,'Heather',null,null,null,null] },
  { name:'Vacuum own room',
    A:[null,null,['Brian','Heather','Ryleigh','Sean','Jack','Nathan'],null,null,null,null],
    B:[null,null,['Brian','Heather','Ryleigh','Nathan'],null,null,null,null] },
  { name:"Mom & Dad's bath",
    A:[null,null,'Heather',null,null,null,null],
    B:[null,null,'Brian',null,null,null,null] },
  { name:"Ryleigh's bath",
    A:[null,null,'Ryleigh',null,null,null,null],
    B:[null,null,'Ryleigh',null,null,null,null] },
  { name:"Boys' bath",
    A:[null,null,'Brian',null,null,null,null],
    B:[null,null,'Heather',null,null,null,null] },
  { name:'Change bed linens',
    A:[null,null,['Brian','Heather','Ryleigh','Sean','Jack','Nathan'],null,null,null,null],
    B:[null,null,null,null,null,null,null] },
  { name:"Scrub tub - Ryleigh's bath", note:'1st wknd',
    A:[null,null,'Ryleigh',null,null,null,null], firstWeekendOnly:true,
    B:[null,null,null,null,null,null,null] },
  { name:"Scrub tub - boys' bath", note:'1st wknd',
    A:[null,null,['Sean','Jack'],null,null,null,null], firstWeekendOnly:true,
    B:[null,null,null,null,null,null,null] },
  { name:'Dust upstairs', note:'1st wknd',
    A:[null,null,'Sean',null,null,null,null], firstWeekendOnly:true,
    B:[null,null,null,null,null,null,null] },
  { name:'Dust downstairs', note:'1st wknd',
    A:[null,null,'Jack',null,null,null,null], firstWeekendOnly:true,
    B:[null,null,null,null,null,null,null] },
];

/* ---------- Week logic ---------- */
/* Week A started Friday July 3, 2026. Cycle length 14 days. */
const WEEK_A_START = new Date(2026,6,3); // month 6 = July
WEEK_A_START.setHours(0,0,0,0);

function dayKey(d){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }

function weekLetterFor(date){
  const d = new Date(date); d.setHours(0,0,0,0);
  const diff = Math.floor((d - WEEK_A_START)/86400000);
  const mod = ((diff % 14) + 14) % 14;
  return mod < 7 ? 'A' : 'B';
}
/* Which chart column (Fri-start) does this date fall in */
function colFor(date){
  return DAYS.indexOf(JS_TO_LABEL[date.getDay()]);
}
/* Is this date the first weekend (Sun) of the current A-block? */
function isFirstWeekendSat(date){
  const d = new Date(date); d.setHours(0,0,0,0);
  if (JS_TO_LABEL[d.getDay()] !== 'Sun') return false;
  const diff = Math.floor((d - WEEK_A_START)/86400000);
  const mod = ((diff % 14) + 14) % 14;
  // Week A block = days 0..6 (Fri..Thu); Sun is day 2 of the block
  return mod === 2;
}

/* Build the task list for a given date, optionally filtered to a person */
function tasksFor(date, person){
  const wk = weekLetterFor(date);
  const col = colFor(date);
  const firstSat = isFirstWeekendSat(date);
  const out = [];
  for (const c of CHORES){
    if (c.firstWeekendOnly && !firstSat) continue;
    const cell = c[wk][col];
    if (!cell) continue;
    const names = Array.isArray(cell) ? cell : [cell];
    if (person && !names.includes(person)) continue;
    out.push({ name: c.name, note: c.note, names });
  }
  return out;
}

/* ---------- Rendering ---------- */
let activePerson = null;
let dateOverride = null; // dev: preview a specific date
const done = {}; // key -> bool, in-memory only

function fmtDate(d){
  return d.toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric'});
}
function fmtShort(d){
  return d.toLocaleDateString('en-US',{month:'short', day:'numeric'});
}

function buildFilter(){
  const wrap = document.getElementById('filterScroll');
  wrap.innerHTML = '';
  const allChip = mkChip('Everyone', null, '#4a5a62');
  wrap.appendChild(allChip);
  for (const name of ORDER){
    wrap.appendChild(mkChip(name, name, PEOPLE[name].color));
  }
}
function mkChip(label, person, color){
  const b = document.createElement('button');
  b.className = 'chip';
  b.setAttribute('aria-pressed', activePerson === person ? 'true' : 'false');
  if (activePerson === person) b.style.background = color;
  b.innerHTML = (person ? '<span class="dot"></span>' : '') + label;
  b.onclick = () => { activePerson = person; render(); };
  return b;
}

function dayCard(date, isToday){
  const tasks = tasksFor(date, activePerson);
  const card = document.createElement('section');
  card.className = 'day';

  const head = document.createElement('div');
  head.className = 'day-head' + (isToday ? ' today' : '');
  head.innerHTML =
    '<div class="day-title">'+
      '<span class="day-when">'+(isToday?'Today':'Tomorrow')+' · '+JS_TO_LABEL[date.getDay()]+'</span>'+
      '<span class="day-date">'+fmtDate(date)+'</span>'+
    '</div>'+
    '<span class="count">'+tasks.length+(tasks.length===1?' task':' tasks')+'</span>';
  card.appendChild(head);

  if (tasks.length === 0){
    const e = document.createElement('div');
    e.className = 'empty';
    e.innerHTML = activePerson
      ? '<strong>'+activePerson+'</strong> has nothing assigned.'
      : 'Nothing on the chart.';
    card.appendChild(e);
    return card;
  }

  const ul = document.createElement('ul');
  for (const t of tasks){
    const key = dayKey(date)+'|'+t.name+'|'+(activePerson||'all');
    const li = document.createElement('li');
    li.className = 'task' + (done[key] ? ' done' : '');
    const whoHtml = t.names.map(n=>{
      const col = PEOPLE[n] ? PEOPLE[n].color : '#4a5a62';
      return '<span class="task-who" style="color:'+col+'"><span class="dot" style="background:'+col+'"></span>'+n+'</span>';
    }).join('<span style="opacity:.4;margin:0 2px">·</span>');
    li.innerHTML =
      '<span class="check"><svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 5"/></svg></span>'+
      '<div class="task-body">'+
        '<div class="task-name">'+t.name+(t.note?'<span class="badge-note">'+t.note+'</span>':'')+'</div>'+
        whoHtml+
      '</div>';
    li.onclick = () => { done[key] = !done[key]; li.classList.toggle('done'); };
    ul.appendChild(li);
  }
  card.appendChild(ul);
  return card;
}

function render(){
  const today = new Date();
  if (dateOverride){ today.setFullYear(dateOverride.y, dateOverride.m, dateOverride.d); }
  today.setHours(0,0,0,0);
  const tomorrow = new Date(today); tomorrow.setDate(today.getDate()+1);

  const wk = weekLetterFor(today);
  const tag = document.getElementById('weektag');
  tag.textContent = 'Week '+wk+(wk==='A'?' · Full house':' · Off week');
  tag.className = 'weektag' + (wk==='B'?' b':'');

  document.getElementById('datebar').textContent =
    fmtShort(today)+'  →  '+fmtShort(tomorrow);

  buildFilter();

  const main = document.getElementById('main');
  main.innerHTML = '';
  main.appendChild(dayCard(today, true));
  main.appendChild(dayCard(tomorrow, false));
}

/* ---------- Dev date override ---------- */
(function(){
  const input = document.getElementById('devdate');
  const reset = document.getElementById('devreset');
  const now = new Date();
  input.value = now.toISOString().slice(0,10);
  input.addEventListener('change', () => {
    if (!input.value){ dateOverride = null; render(); return; }
    const [y,m,d] = input.value.split('-').map(Number);
    dateOverride = { y, m: m-1, d };
    render();
    document.getElementById('devdate').value = input.value; // keep after re-render
  });
  reset.addEventListener('click', () => {
    dateOverride = null;
    render();
    document.getElementById('devdate').value = new Date().toISOString().slice(0,10);
  });
})();

render();</script>
</body>
</html>
